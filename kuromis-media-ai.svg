<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Kuromis 库洛米 4K 超清流媒体与前沿 AI 工具加速视界">
  <defs>
    <radialGradient id="mediaGlow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#6b21a8" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#0e7490" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#07070d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#090913" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotMatrix" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(34,211,238,0.16)"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#07070d"/>
  <rect width="1200" height="675" fill="url(#mediaGlow)"/>
  <rect width="1200" height="675" fill="url(#dotMatrix)"/>

  <!-- Energy Streams Connecting AI Core to 4K Screen -->
  <path d="M 350 340 C 480 230, 560 440, 690 335" fill="none" stroke="#22d3ee" stroke-width="3.5" filter="url(#glow)"/>
  <path d="M 350 355 C 490 460, 560 220, 690 350" fill="none" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/>

  <!-- Left Panel: AI Neural Crystal Core -->
  <g transform="translate(80, 130)">
    <rect width="380" height="415" rx="22" fill="url(#screenGlass)" stroke="rgba(34,211,238,0.38)" stroke-width="1.6"/>
    <text x="32" y="48" fill="#22d3ee" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2">AI NEURAL ACCELERATION</text>
    <text x="32" y="78" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">全球 AI 算力原生直连</text>

    <!-- Faceted Crystal Octahedron -->
    <g transform="translate(190, 215)">
      <circle cx="0" cy="0" r="88" fill="rgba(34,211,238,0.12)" stroke="rgba(192,132,252,0.3)" stroke-width="1.2" stroke-dasharray="5 7"/>
      <polygon points="0,-68 52,-18 32,58 -32,58 -52,-18" fill="url(#crystalGrad)" stroke="#cffafe" stroke-width="2" filter="url(#glow)"/>
      <polyline points="0,-68 0,58" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
      <polyline points="-52,-18 52,-18" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>
      <circle cx="0" cy="-6" r="10" fill="#ffffff" filter="url(#glow)"/>
    </g>

    <!-- AI Service Chips -->
    <g transform="translate(32, 336)">
      <rect width="98" height="32" rx="16" fill="rgba(34,211,238,0.14)" stroke="rgba(34,211,238,0.45)"/>
      <text x="49" y="21" text-anchor="middle" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ChatGPT</text>

      <rect x="110" width="94" height="32" rx="16" fill="rgba(34,211,238,0.14)" stroke="rgba(34,211,238,0.45)"/>
      <text x="157" y="21" text-anchor="middle" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Claude</text>

      <rect x="216" width="100" height="32" rx="16" fill="rgba(34,211,238,0.14)" stroke="rgba(34,211,238,0.45)"/>
      <text x="266" y="21" text-anchor="middle" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Gemini</text>
    </g>
  </g>

  <!-- Center Speed Bridge Badge -->
  <g transform="translate(515, 295)">
    <rect width="170" height="86" rx="16" fill="rgba(15,16,26,0.95)" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
    <text x="85" y="38" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace, monospace" font-size="18" font-weight="800">NATIVE IP</text>
    <text x="85" y="64" text-anchor="middle" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">低风控 · 零降智</text>
  </g>

  <!-- Right Panel: 4K UHD Cinema Display -->
  <g transform="translate(740, 130)">
    <rect width="380" height="415" rx="22" fill="url(#screenGlass)" stroke="rgba(192,132,252,0.42)" stroke-width="1.6"/>
    <text x="32" y="48" fill="#c084fc" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="2">4K UHD STREAMING</text>
    <text x="32" y="78" fill="#f5f3ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">超高清流媒体全区畅看</text>

    <!-- Floating Cinema Screen -->
    <g transform="translate(36, 112)">
      <rect width="308" height="172" rx="14" fill="#0d0e1a" stroke="rgba(192,132,252,0.55)" stroke-width="2"/>
      <!-- Audio / Video Spectrum Waves -->
      <path d="M 24 118 Q 70 50 116 110 T 208 92 T 286 112" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.8"/>
      <path d="M 24 130 Q 82 85 140 124 T 240 100 T 286 126" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.7"/>
      <!-- Play Triangle -->
      <circle cx="154" cy="82" r="30" fill="rgba(147,51,234,0.85)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
      <polygon points="146,69 170,82 146,95" fill="#ffffff"/>
      <!-- 4K Progress Bar -->
      <rect x="20" y="146" width="268" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
      <rect x="20" y="146" width="210" height="6" rx="3" fill="#22d3ee"/>
    </g>

    <!-- Streaming Chips -->
    <g transform="translate(32, 336)">
      <rect width="98" height="32" rx="16" fill="rgba(147,51,234,0.22)" stroke="rgba(192,132,252,0.5)"/>
      <text x="49" y="21" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Netflix</text>

      <rect x="110" width="96" height="32" rx="16" fill="rgba(147,51,234,0.22)" stroke="rgba(192,132,252,0.5)"/>
      <text x="158" y="21" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Disney+</text>

      <rect x="218" width="98" height="32" rx="16" fill="rgba(147,51,234,0.22)" stroke="rgba(192,132,252,0.5)"/>
      <text x="267" y="21" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">YouTube 4K</text>
    </g>
  </g>
</svg>
